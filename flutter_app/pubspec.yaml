name: bim_sign_app
description: BIM Sign Language Recognition Test App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.12.1
  camera: ^0.11.0+2
  image: ^4.3.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/model_stage3_1_float16.tflite
    - assets/landmark_classifier.tflite
    - assets/hand_landmark_lite.tflite
    - assets/classes.txt
